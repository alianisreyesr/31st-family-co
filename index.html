<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121210" />

    <!--
      La política de seguridad de contenidos la escribe aquí `npm run build:ssg`,
      deducida de la configuración: solo abre los hosts que estén realmente
      conectados (Plausible, el proveedor de la lista). Va en <meta> y no en una
      cabecera porque así viaja con el HTML y vale igual en Netlify, en Vercel o
      arrastrando `dist/` a cualquier sitio, sin configurar nada.
      `frame-ancestors` no se admite en <meta>: eso lo cubre X-Frame-Options,
      que sí va en las cabeceras de los dos hosts.
    -->
    <!--csp-->

    <!--
      Fuentes auto-hospedadas (`npm run fonts`). Ya no hay preconnect a Google:
      ni se le manda la IP de cada visitante ni hacen falta dos conexiones
      nuevas antes de pedir el primer archivo.

      Solo se precargan las cuatro caras de la primera pantalla, en su subconjunto
      latino: el titular (Manrope 700 y la cursiva Playfair de «Somos familia.»),
      el cuerpo (Manrope 400) y los rótulos en monoespaciada. El resto lo pide el
      CSS cuando toca. `crossorigin` es obligatorio en el preload de fuentes: sin
      él el navegador descarga el archivo dos veces.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/manrope-v20-400-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/manrope-v20-700-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/dm-mono-v16-500-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/playfair-display-v40-500-italic-latin.woff2"
    />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://31stfamilyco.com/" />

    <!--
      `npm run build:ssg` cambia esto a `noindex, nofollow` cuando el despliegue
      no es el dominio de producción: una vista previa indexada competiría como
      contenido duplicado contra el sitio real de la marca.
    -->
    <meta name="robots" content="index, follow" />

    <title>31st Family Co | Más que una marca, somos familia</title>
    <meta
      name="description"
      content="Streetwear nacido en Puerto Rico desde 2024. Únete a la Family List para el acceso anticipado al próximo drop y explora el archivo de piezas agotadas."
    />

    <!--
      Open Graph y Twitter: sin esto, compartir el link por WhatsApp o en
      Stories mostraba solo la URL pelada, sin imagen ni titular.
      La tarjeta es una foto real del producto con el logotipo, generada por
      `node scripts/build-brand-assets.mjs`.
      `npm run build:ssg` reescribe estos valores por ruta.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="31st Family Co" />
    <meta property="og:locale" content="es_PR" />
    <meta property="og:title" content="31st Family Co | Más que una marca, somos familia" />
    <meta
      property="og:description"
      content="Streetwear nacido en Puerto Rico desde 2024. Únete a la Family List para el acceso anticipado al próximo drop y explora el archivo de piezas agotadas."
    />
    <meta property="og:url" content="https://31stfamilyco.com/" />
    <meta property="og:image" content="https://31stfamilyco.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Gorras de 31st Family Co con el logotipo de la marca" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="31st Family Co | Más que una marca, somos familia" />
    <meta
      name="twitter:description"
      content="Streetwear nacido en Puerto Rico desde 2024. Únete a la Family List para el acceso anticipado al próximo drop y explora el archivo de piezas agotadas."
    />
    <meta name="twitter:image" content="https://31stfamilyco.com/og-image.jpg" />

    <script type="application/ld+json">
      {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
